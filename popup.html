<!-- Add Pro UI: license entry, API base, AI generate button -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AI Post Composer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h2>AI Post Composer (MVP)</h2>

    <label>Platform
      <select id="platform">
        <option value="linkedin">LinkedIn</option>
        <option value="twitter">X / Twitter</option>
      </select>
    </label>

    <label>Type
      <select id="type">
        <option value="short">Short post</option>
        <option value="thread">Thread / long post</option>
        <option value="promo">Call-to-action</option>
        <option value="personal">Personal story</option>
      </select>
    </label>

    <label>Tone
      <select id="tone">
        <option value="professional">Professional</option>
        <option value="friendly">Friendly</option>
        <option value="casual">Casual</option>
        <option value="confident">Confident</option>
      </select>
    </label>

    <label>Keywords / context
      <input id="context" placeholder="e.g., CS50, project, interview tips" />
    </label>

    <label>Length
      <input id="length" type="range" min="1" max="5" value="2" />
      <div id="lengthValue">Medium</div>
    </label>

    <div class="buttons">
      <button id="generate">Generate</button>
      <button id="generateAI" class="secondary">Generate (AI)</button>
      <button id="copy" class="secondary">Copy</button>
    </div>

    <textarea id="output" placeholder="Generated post will appear here"></textarea>

    <div class="pro">
      <label>Pro license key
        <input id="license" placeholder="paste your license key" />
      </label>
      <div style="display:flex;gap:8px;margin-top:6px;align-items:center">
        <button id="activate">Activate</button>
        <div id="licenseStatus" style="font-size:13px;color:#64748b">Not activated</div>
      </div>
      <label style="margin-top:8px">API base (deployed server URL)
        <input id="apiBase" placeholder="https://your-deploy.vercel.app" />
      </label>
    </div>

    <div class="footer">
      <small>MVP: Templates only unless Pro is activated. Pro enables AI generation via your deployed server.</small>
      <a href="REPLACE_WITH_GUMROAD_LINK" id="buy" target="_blank">Get Pro / lifetime deal</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
